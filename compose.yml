name: dienbien-pet-demo
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-petdemo}
      POSTGRES_DB: ${POSTGRES_DB:-petdemo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  model:
    build:
      context: .
      dockerfile: model_service/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      STORAGE_DIR: /data
      MODEL_CHECKPOINT: /models/baseline.pt
      MODEL_DEVICE: ${MODEL_DEVICE:-cpu}
      CUDA_VISIBLE_DEVICES: "0"
    ports: ["127.0.0.1:${MODEL_PORT:-8109}:8001"]
    volumes:
      - ./data:/data
      - ${MODEL_CHECKPOINT:?Set MODEL_CHECKPOINT}:/models/baseline.pt:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      STORAGE_DIR: /data
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-petdemo}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-petdemo}
      MODEL_API_URL: http://model:8001
    ports: ["${API_PORT:-8108}:8000"]
    volumes: ["./data:/data"]
    command: ["sh", "-c", "alembic upgrade head && uvicorn backend.app:app --host 0.0.0.0 --port 8000"]
    depends_on:
      db: {condition: service_healthy}
      model: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      STORAGE_DIR: /data
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-petdemo}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-petdemo}
      MODEL_API_URL: http://model:8001
    volumes: ["./data:/data"]
    command: ["python", "-m", "backend.worker"]
    depends_on:
      backend: {condition: service_healthy}
  frontend:
    build:
      context: frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_API_PORT: ${API_PORT:-8108}
    restart: unless-stopped
    ports: ["${WEB_PORT:-3108}:80"]
    depends_on:
      backend: {condition: service_healthy}
volumes:
  postgres_data:
networks:
  default:
    ipam:
      config:
        - subnet: ${DEMO_SUBNET:-10.253.108.0/24}
